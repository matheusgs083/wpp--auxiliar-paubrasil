else if(view==='teams'){let rows=[];if(op==='patos'){D.monday.forEach(t=>rows.push(['Segunda',...t,'']));['Terça','Quarta','Quinta','Sexta'].forEach(d=>D.teams.forEach(t=>rows.push([d,...t,''])));rows.push(['Sábado','Pernoite 1',D.saturdayDrivers[0],'Anderson','Michell Rodrigo Macedo Dantas','Jeferson Gomes Martins Lima'],['Sábado','Pernoite 2',D.saturdayDrivers[1],'Mauricio Apolinario Nobrega Filho','Matheus da Silva Almeida','Jose Marcelo Galdino Pereira'],['Sábado','Pernoite 3',D.saturdayDrivers[2],'Alysson','Joao Vitor','Gilmar Soares Ferreira'])}else{['Segunda','Terça','Quarta','Quinta','Sexta'].forEach(d=>D.sumeTeams.forEach(t=>rows.push([d,...t,''])))}document.getElementById('view').innerHTML=card(name+' — escala',table(['Dia','Equipe','Motorista','Ajudante 1','Ajudante 2','Ajudante 3'],rows.map(row=>row.map(esc)))+'<p class="note">'+(op==='patos'?'Segunda: 22 ajudantes disponíveis para 15 rotas. Só 7 rotas podem ter 2 ajudantes; 8 ficam com 1. Se cada rota exigir 2, faltam 8 ajudantes na segunda. Validar carga antes de liberar compensações.':'Leonaldo, Irismark e Cassio compõem apoio/cobertura. Ajudantes A, B e C são vagas previstas, ainda não disponíveis.')+'</p>')}
else if(view==='reversal') drawReversal();else drawBank();}
function drawReversal(){
const groups=[['Patos','Motoristas','patos',D.drivers,80],['Patos','Ajudantes','patos',D.helpers,32],['Sumé','Motoristas','sume',D.sumeDrivers,24],['Sumé','Ajudantes','sume',D.sumeHelpers,40]];
const balance=(branch,names)=>names.reduce((s,n)=>{const p=D.sources[branch].people;const v=p[norm(n)]||(norm(n)==='JEFERSON BARROS DE MELO'?p['JEFFERSON BARROS DE MELO']:null);return s+Math.max(0,v?.balance||0)},0);
const rows=groups.map(([branch,role,key,names,rate])=>{const b=balance(key,names);return [branch,role,fmt(b),rate+'h',Math.ceil(b/(rate*60))+' semanas',key==='sume'&&role==='Motoristas'?'Condicionado a 3 coberturas de rota por semana':'Após admissões e confirmação da demanda']});
const total=groups.reduce((s,g)=>s+balance(g[2],g[3]),0);
document.getElementById('view').innerHTML=card('Plano de reversão — Patos e Sumé','<p class="muted">Base: espelhos de 01 a 10/11/2026 e quadro informado. Este plano reúne as duas operações; as demais abas acompanham a operação selecionada.</p><div class="metrics"><div class="metric">Banco positivo conhecido<b>'+fmt(total)+'</b></div><div class="metric">Meta com quadro completo<b>10 semanas</b></div><div class="metric">Jornada usada no plano<b>8h / compensação</b></div></div><p class="note">As 10 semanas começam após as admissões e a cobertura de Sumé estarem disponíveis. Sem novos créditos e com as metas cumpridas. Não é um prazo garantido no quadro atual incompleto.</p>'+table(['Operação','Grupo','Saldo positivo','Meta semanal','Prazo','Condição'],rows)+
'<h3>1. Cenário atual — ação imediata</h3>'+table(['Operação','Situação','Execução agora'],[
['Patos — motoristas','17 disponíveis no quadro informado; 3 folgam segunda após sábado. Restam 14 para 15 rotas.','Garantir 1 cobertura na segunda. Antes das admissões, até 2 compensações por dia de terça a sexta, somente se houver 15 motoristas aptos para as rotas; sem reserva.'],
['Patos — ajudantes','31 planejados; Alysson e João Vitor ainda dependem de admissão. Com 29, ficam 20 na segunda após 9 folgas.','Não liberar compensações fixas antes das admissões. Se as 15 rotas exigirem 2 ajudantes, faltam 10 na segunda e 1 de terça a sexta. Ajustar a carga e a cobertura.'],
['Sumé — motoristas','5 motoristas para 5 rotas.','Compensar horas após retorno ou em dias com até 4 rotas. Sem prazo fixo até garantir cobertura.'],
['Sumé — ajudantes','8 atuais e 3 vagas previstas.','Antes das admissões, compensar somente com sobra comprovada. Para 5 equipes com 2 ajudantes, faltam 2.']])+ 
'<h3>2. Após completar o quadro — programação semanal</h3>'+table(['Grupo','Segunda','Terça','Quarta','Quinta','Sexta','Total'],[
['Patos — motoristas','1 × 8h','3 × 8h','2 × 8h','2 × 8h','2 × 8h','80h'],
['Patos — ajudantes','Sem compensação','1 × 8h','1 × 8h','1 × 8h','1 × 8h','32h'],
['Sumé — motoristas','Cobertura a definir','Cobertura a definir','Cobertura a definir','Cobertura a definir','Cobertura a definir','3 × 8h = 24h'],
['Sumé — ajudantes','1 × 8h','1 × 8h','1 × 8h','1 × 8h','1 × 8h','40h']])+ 
'<p class="note">Patos: mesmo com 31 ajudantes, ficam apenas 22 na segunda após as folgas do pernoite. Para 15 rotas com 2 ajudantes faltam 8. A meta de banco dos ajudantes é só de terça a sexta. Sumé: definir previamente os três dias de cobertura dos motoristas, sem usar motorista já comprometido em Patos.</p>'+ 
'<h3>3. Ordem de execução e responsáveis</h3>'+table(['Prazo','Responsável','Entrega'],[
['Preparação','Gestão / RH','Confirmar Motoristas A e B, Alysson e João Vitor em Patos e Ajudantes A, B e C em Sumé; confirmar habilitação e início.'],
['Toda sexta, antes da semana seguinte','Supervisão de entrega','Publicar folgas nominais conforme saldo, rotas, carga e cobertura. Preservar sábado → segunda em Patos, mesmo com cancelamento da rota.'],
['Semanas 1 a 5 após admissões','Supervisão / ponto','Executar as metas. Prioridades Patos motoristas: Cosmo, Túlio, Laíres, Francileudo e Leonardo; ajudantes: Avany e Maurício.'],
['Semanas 1 a 10 após admissões','Supervisão de Sumé / ponto','Priorizar Genilson, Luiz C, Irismark e Cassio nos ajudantes; Yan e Valdeci nos motoristas, conforme cobertura.'],
['Semanas 6 a 10','Supervisão / ponto','Concluir saldos restantes; fracionar resíduos menores que 8h. Não gerar saldo negativo para cumprir meta.'],
['Toda sexta após fechamento do ponto','Controle de ponto','Apurar saldo inicial + novos créditos − compensações efetivas = saldo final. Recalcular o prazo por grupo.']])+ 
'<p class="rule">Não contar folgas normais da 5x2 como abatimento adicional. A redução depende do lançamento efetivo no ponto e de conter novas horas extras. Saldos negativos são controlados separadamente e não reduzem a dívida positiva de outros colaboradores.</p><p class="muted">Fonte: '+esc(D.sources.patos.source)+' e '+esc(D.sources.sume.source)+'. Não inclui créditos posteriores a 10/11 nem saldo não localizado dos novos integrantes.</p>');
}
const reversalButton=document.createElement('button');reversalButton.dataset.view='reversal';reversalButton.textContent='Plano de reversão';document.getElementById('views').appendChild(reversalButton);
function drawBank(){document.getElementById('view').innerHTML=card((op==='patos'?'Patos':'Sumé')+' — execução do banco','<p class="muted">'+esc(D.sources[op].period)+'. Saldo positivo separado dos saldos negativos. Folga regular 5x2 não entra como abatimento de banco.</p><div class="toolbar"><label><input id="hires" type="checkbox" checked>Simular quadro completo após admissões</label><label>Horas por compensação <input id="hours" type="number" min="1" max="12" step="0.5" value="8"></label><label>Novos créditos por semana (h) <input id="credits" type="number" min="0" value="0"></label></div><p class="note">Simulação: confirme admissões e necessidade diária antes de executar. Débito de 8h é uma premissa; aplicar a jornada efetivamente programada. Créditos futuros devem ser descontados da redução projetada.</p><div id="plan"></div>');document.querySelectorAll('.toolbar input').forEach(x=>x.addEventListener('input',plan));plan()}
function plan(){const r=roster(),full=document.getElementById('hires').checked,h=+document.getElementById('hours').value||8,credit=+document.getElementById('credits').value||0;
const groups=[['Motoristas',r.m],['Ajudantes',r.a]];let total=0;
let body=groups.map(([role,names],gi)=>{const people=names.map(n=>({n,p:record(n)})),positive=people.reduce((s,x)=>s+Math.max(0,x.p?.balance||0),0),negative=people.reduce((s,x)=>s+Math.min(0,x.p?.balance||0),0);total+=positive;
let target=op==='patos'?(gi===0?10:full?4:0):(gi===0?0:full?5:0);return '<h3>'+role+'</h3>'+table(['Saldo positivo','Saldo negativo','Meta inicial','Abatimento bruto semanal'],[[fmt(positive),fmt(negative),target+' compensações',fmt(target*h*60)]])+table(['Prioridade','Colaborador','Saldo atual','Variação desde 01/11','Ação'],people.filter(x=>x.p?.balance>0).sort((a,b)=>b.p.balance-a.p.balance).map((x,i)=>[i+1,esc(x.n),fmt(x.p.balance),fmt(x.p.balance-x.p.opening),x.p.balance>=h*60?'Compensação de '+h+'h, se houver cobertura':'Saída antecipada de '+fmt(x.p.balance)]));}).join('');
const slots=op==='patos'?(full?14:8):(full?5:0),net=slots*h-credit,weeks=net>0?Math.ceil(total/60/net):null;
const instructions=op==='patos'?['Motoristas: programar 2 compensações por dia de segunda a sexta após completar 19. Segunda ficam 16 disponíveis, 15 necessários: só 1 folga integral; distribuir 1 seg, 3 ter, 2 qua, 2 qui e 2 sex, mantendo 1 reserva de terça a sexta.','Ajudantes: nenhuma compensação de banco na segunda. Com 31 e demanda de 30 de terça a sexta, liberar no máximo 1 por dia (4 por semana). Antes de Alysson e João Vitor entrarem, não há sobra para essa meta.','Sábado: manter 3 equipes de pernoite. A folga obrigatória na segunda não deve ser contada novamente como compensação do saldo.','Travar novas horas: planejar carga e término da rota; usar motoristas de cobertura para evitar extensão de jornada. Conferir os saldos toda sexta e substituir os nomes já compensados.']:['Motoristas: 5 no quadro para 5 rotas. Não há folga integral de banco garantida; usar saídas antecipadas após retorno ou dias com até 4 rotas. Não prometer prazo para zerar esse grupo.','Ajudantes: após as 3 admissões, programar 1 compensação por dia, segunda a sexta, priorizando os maiores saldos. Com 11 e 1 em folga ficam 10 para até 5 equipes com 2 ajudantes.','Antes das contratações há 8 ajudantes: com exigência de 2 por rota faltam 2 para 5 rotas, portanto não programar abatimento integral fixo.','Revisar as rotas que continuam gerando crédito. Se houver novos créditos, o prazo aumenta; reduzir tempo de carga, espera e retorno e atualizar o saldo semanalmente.'];
body='<div class="metrics"><div class="metric">Saldo positivo conhecido<b>'+fmt(total)+'</b></div><div class="metric">Abatimento líquido simulado<b>'+net.toFixed(1)+'h/sem</b></div><div class="metric">Prazo aritmético do saldo total<b>'+(op==='sume'?'Por grupo':weeks?weeks+' semanas':'Sem redução')+'</b></div></div><ol>'+instructions.map(s=>'<li style="margin:12px 0">'+s+'</li>').join('')+'</ol>'+body;
if(op==='sume'){const b=r.a.reduce((s,n)=>s+Math.max(0,record(n)?.balance||0),0);body+='<p class="note">Ajudantes: '+(full&&5*h>credit?Math.ceil(b/60/(5*h-credit))+' semanas estimadas':'sem capacidade fixa antes das admissões')+'. Prazo sem novos créditos além do valor informado. Motoristas dependem de redução de demanda ou liberação parcial.</p>'}
else body+='<p class="note">O prazo é uma referência agregada de capacidade, não um prazo garantido por grupo. Antes das duas admissões, são 17 motoristas: com 3 folgas na segunda, ficam 14 para 15 rotas (falta 1). As 8 compensações possíveis antes das admissões ficam de terça a sexta, 2 por dia, sem reserva nesses dias. Cada pessoa precisa ter saldo suficiente; concluir resíduos por horas, sem gerar saldo negativo.</p>';
document.getElementById('plan').innerHTML=body;}
document.querySelectorAll('[data-op]').forEach(b=>b.addEventListener('click',()=>{op=b.dataset.op;draw()}));document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;draw()}));document.getElementById('print').onclick=()=>window.print();draw();
</script></body></html>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Central Pau Brasil - Login</title>
  <style>
    :root {
      --bg: #060d1b;
      --panel: rgba(11, 18, 32, 0.92);
      --line: rgba(148, 163, 184, 0.24);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --brand: #60a5fa;
      --danger: #fca5a5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, Segoe UI, system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 12%, rgba(96, 165, 250, 0.22), transparent 28%),
        radial-gradient(circle at 88% 8%, rgba(37, 99, 235, 0.24), transparent 30%),
        var(--bg);
      padding: 24px;
    }
    .card {
      width: min(460px, 100%);
      border: 1px solid var(--line);
      border-radius: 26px;
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.96), rgba(8, 15, 30, 0.94));
      box-shadow: 0 24px 70px rgba(2, 8, 23, 0.55);
      padding: 30px;
    }
    .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
    .mark {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 26px;
      color: white;
      background: linear-gradient(135deg, #0f2c63, #2563eb);
      border: 1px solid rgba(255,255,255,0.14);
    }
    .brand .brand-symbol { width: 44px; height: 52px; flex: 0 0 auto; color: #fff; }
    .brand strong { display: block; letter-spacing: .08em; font-size: 14px; }
    .brand span { color: var(--muted); font-size: 13px; }
    h1 { font-size: 28px; line-height: 1.1; margin: 0 0 10px; }
    p { margin: 0 0 22px; color: var(--muted); }
    label { display: block; margin-bottom: 8px; font-weight: 700; }
    input {
      width: 100%;
      border: 1px solid var(--line);
      background: #0b1220;
      color: var(--text);
      border-radius: 14px;
      padding: 14px 15px;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(96,165,250,.14); }
    button {
      width: 100%;
      margin-top: 16px;
      border: 0;
      border-radius: 14px;
      padding: 14px 16px;
      font-weight: 800;
      color: white;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      cursor: pointer;
    }
    button:disabled { opacity: .68; cursor: wait; }
    .error { min-height: 22px; margin-top: 12px; color: var(--danger); font-size: 14px; }
    .note { margin-top: 18px; font-size: 13px; color: var(--muted); }
    .legacy {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }
    .legacy summary {
      cursor: pointer;
      color: var(--brand);
      font-weight: 700;
      margin-bottom: 12px;
    }
  </style>
<!--#include painel/favicon.html -->
</head>
<body>
  <main class="card">
    <div class="brand">
<!--#include painel/simbolo.html -->
      <div><strong>Central Pau Brasil</strong></div>
    </div>
    <h1>Entrar no painel</h1>
    <p>Use seu usuário e senha para acessar os blocos liberados.</p>
    <form id="loginForm">
      <label for="username">Usuário</label>
      <input id="username" name="username" type="text" autocomplete="username" autofocus>
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password">
      <details class="legacy">
        <summary>Entrar com token legado</summary>
        <label for="token">Token de acesso</label>
        <input id="token" name="token" type="password" autocomplete="off">
      </details>
      <button id="submitBtn" type="submit">Entrar</button>
      <div id="error" class="error" role="alert"></div>
    </form>
    <div class="note">A sessão expira automaticamente. Não compartilhe esse acesso fora da rede autorizada.</div>
  </main>
  <script>
    const form = document.getElementById("loginForm");
    const username = document.getElementById("username");
    const password = document.getElementById("password");
    const token = document.getElementById("token");
    const errorBox = document.getElementById("error");
    const submitBtn = document.getElementById("submitBtn");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Validando...";
      try {
        const userValue = username.value.trim();
        const passwordValue = password.value;
        const tokenValue = token.value.trim();
        let body = {};
        if (userValue || passwordValue) {
          body = { username: userValue, password: passwordValue };
        } else if (tokenValue) {
          body = { token: tokenValue };
        } else {
          throw new Error("Informe usuário e senha.");
        }
        const response = await fetch("/api/admin/panel/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.detail || "Login inválido.");
        if (payload.requires_password_change) {
          window.location.assign("/trocar-senha");
          return;
        }
        window.location.assign("/");
      } catch (error) {
        errorBox.textContent = error.message || "Falha no login.";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Entrar";
      }
    });
  </script>
</body>
</html>
